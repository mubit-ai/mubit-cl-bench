<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Database Exploration — CL-Bench instrument</title>
<link rel="stylesheet" href="style.css"></head><body>
<header class="top"><h1>CL-Bench instrument</h1>
<nav><a href="index.html">Overview</a><a href="bsm.html">Spectrum</a>
<a href="db.html" aria-current="page">Database</a><a href="poker.html">Poker</a>
<button id="theme">Theme</button></nav></header>
<main id="main"></main>
<script src="../viz_data/db.js"></script><script src="chart.js"></script>
<script>
(function () {
  "use strict";

  // ------------------------------------------------------------- theme ----
  var THEMES = [null, "light", "dark"];
  var ti = 0;
  var themeBtn = document.getElementById("theme");
  themeBtn.addEventListener("click", function () {
    ti = (ti + 1) % THEMES.length;
    if (THEMES[ti] === null) delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = THEMES[ti];
    themeBtn.textContent = "Theme: " + (THEMES[ti] || "auto");
  });

  // -------------------------------------------------------------- data ----
  var DB = window.VIZ_DB;
  var A = DB.artifacts;
  var D = DB.detail;
  var main = document.getElementById("main");

  // Comparability bands. The ONLY clean head-to-head is the 2.5-flash trio.
  var BAND_25 = ["icl-db-3", "mubit-db-3", "mubit-full-db-3"];
  var BAND_35 = ["mubit-genai-db-3", "mubit-genai-db-full-3.5flash"];
  var ORDER = BAND_25.concat(BAND_35);
  var DIVIDER = [BAND_25.length - 1]; // rule after the last 2.5-flash group

  // Colour is bound to the SYSTEM, never to rank or to a chart position.
  function colorOf(id) {
    if (id.indexOf("icl") === 0) return "--sys-icl";
    if (id.indexOf("mubit-genai") === 0) return "--sys-mubit-genai";
    if (id.indexOf("mubit-full") === 0) return "--sys-mubit-full";
    if (id.indexOf("mubit") === 0) return "--sys-mubit";
    return "--sys-baseline";
  }
  var SHORT = {
    "icl-db-3": "icl-db-3",
    "mubit-db-3": "mubit-db-3",
    "mubit-full-db-3": "mubit-full-db-3",
    "mubit-genai-db-3": "mubit-genai-db-3",
    "mubit-genai-db-full-3.5flash": "mubit-genai-full"
  };
  function shortModel(m) { return m.replace(/^gemini\//, "").replace(/^gemini-/, ""); }
  function mean(xs) { var t = 0, i; for (i = 0; i < xs.length; i++) t += xs[i]; return t / xs.length; }
  function meanInput(id) { return mean(A[id].usage.runs.map(function (r) { return r.input_tokens; })); }
  function meanCost(id) { return mean(A[id].usage.runs.map(function (r) { return r.cost_usd; })); }
  function halfMean(arr, a, b) { return mean(arr.slice(a, b)); }
  var ESCMAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
  function esc(v) {
    return String(v === null || v === undefined ? "—" : v)
      .replace(/[&<>"]/g, function (c) { return ESCMAP[c]; });
  }
  var f1 = function (v) { return V.fmt(v, 1); };
  var f3 = function (v) { return V.fmt(v, 3); };
  var f4 = function (v) { return V.fmt(v, 4); };
  var pc1 = function (v) { return V.pct(v, 1); };
  var usd = function (v) { return "$" + v.toFixed(3); };

  // -------------------------------------------------------------- chrome --
  function act(title, lede) {
    var s = document.createElement("section");
    s.className = "act";
    var h = document.createElement("h2"); h.textContent = title; s.appendChild(h);
    var p = document.createElement("p"); p.className = "lede"; p.innerHTML = lede; s.appendChild(p);
    main.appendChild(s);
    return s;
  }
  function flag(sec, cls, html) {
    var d = document.createElement("div");
    d.className = "flag" + (cls ? " " + cls : "");
    d.innerHTML = html;
    sec.appendChild(d);
    return d;
  }
  function tiles(sec, items) {
    var w = document.createElement("div"); w.className = "tiles";
    items.forEach(function (t) {
      var d = document.createElement("div"); d.className = "tile";
      d.innerHTML = '<div class="lbl">' + t.lbl + '</div><div class="val">' + t.val +
        '</div><div class="sub">' + t.sub + "</div>";
      w.appendChild(d);
    });
    sec.appendChild(w);
    return w;
  }
  function colorKey(sec, items) {
    var l = document.createElement("div"); l.className = "legend";
    l.style.margin = "0 0 20px";
    items.forEach(function (it) {
      var item = document.createElement("span"); item.className = "lg-item";
      var sw = document.createElement("span");
      sw.className = "lg-swatch" + (it[2] ? " lg-dash" : "");
      sw.style.setProperty("--sw", "var(" + it[1] + ")");
      var tx = document.createElement("span"); tx.textContent = it[0];
      item.appendChild(sw); item.appendChild(tx);
      l.appendChild(item);
    });
    sec.appendChild(l);
    return l;
  }

  // One bar per artifact; the bar name is the MEASURE so the table twin stays a
  // clean two-column read, while each bar keeps its system colour.
  function measureGroups(ids, measureName, valueOf) {
    return ids.map(function (id) {
      return {
        label: SHORT[id],
        sublabel: shortModel(A[id].model),
        bars: [{ name: measureName, color: colorOf(id), value: valueOf(id) }]
      };
    });
  }

  // ============================================================ ACT 0 =====
  var qCount = D["mubit-db-3"].questions.length;
  var hardCount = D["mubit-db-3"].questions.filter(function (q) { return q.difficulty === "hard"; }).length;
  var questionRuns = 0, budgetExceeded = 0, timedOut = 0, maxQueries = 0;
  ORDER.forEach(function (id) {
    D[id].runs.forEach(function (r) {
      r.outcomes.forEach(function (o) {
        questionRuns++;
        if (o.budget_exceeded) budgetExceeded++;
        if (o.timed_out) timedOut++;
        if (o.num_queries > maxQueries) maxQueries = o.num_queries;
      });
    });
  });
  var QUERY_CAP = maxQueries; // observed cap; nothing recorded budget_exceeded

  var s0 = act("The instrument",
    "Task <b>database_exploration</b>: an agent answers " + qCount + " natural-language questions against a " +
    "database it can only see through queries, under a hard query cap. Reward is <b>1 − normalized " +
    "exploration regret</b>, so a run is paid for being both right and cheap. Every artifact is 3 runs × " +
    qCount + " questions, and every artifact carries its own <i>stateless</i> baseline — the same agent with " +
    "memory switched off. Normalized gain is <code>g_b = (r_sf − r_sl) / (r_max − r_sl)</code>, which is " +
    "why an artifact can be very accurate and still score almost no gain.");

  tiles(s0, [
    { lbl: "Questions per run", val: qCount, sub: hardCount + " of " + qCount + " labelled “hard” — no difficulty variation exists to plot" },
    { lbl: "Artifacts", val: ORDER.length, sub: BAND_25.length + " on gemini-2.5-flash, " + BAND_35.length + " on gemini-3.5-flash" },
    { lbl: "Runs per artifact", val: A["mubit-db-3"].n_runs, sub: "n=3 — spread is shown as min/max, never as an error bar" },
    { lbl: "Question-runs recorded", val: questionRuns, sub: budgetExceeded + " budget_exceeded, " + timedOut + " timed_out; observed query cap " + QUERY_CAP }
  ]);

  flag(s0, "warn",
    "<b>Two comparability bands, not one leaderboard.</b> " +
    BAND_25.map(function (id) { return "<code>" + id + "</code>"; }).join(", ") +
    " ran on <code>" + A["icl-db-3"].model + "</code>. " +
    BAND_35.map(function (id) { return "<code>" + id + "</code>"; }).join(" and ") +
    " ran on <code>" + A["mubit-genai-db-3"].model + "</code>. A different base model changes the reward " +
    "scale <i>and</i> the stateless baseline, so a number from one band cannot be ranked against a number " +
    "from the other. Every chart below either draws a rule between the bands or splits them into separate " +
    "cards. Nothing is imported from outside this repo — there are no competitor numbers on this page " +
    "because none were measured here.");

  colorKey(s0, [
    ["icl-db-3 — in-context stuffing", "--sys-icl", false],
    ["mubit-db-3 — retrieval memory", "--sys-mubit", false],
    ["mubit-full-db-3 — full memory stack", "--sys-mubit-full", false],
    ["mubit-genai-* — 2 artifacts, 3.5-flash", "--sys-mubit-genai", false],
    ["stateless baseline of any system", "--sys-baseline", true]
  ]);

  // ============================================================ ACT I =====
  var s1 = act("Act I — head-to-head at a fixed model",
    "Three panels, three measures, three separate charts — never one chart with two axes. The three " +
    "2.5-flash artifacts are the only clean head-to-head; the two 3.5-flash artifacts sit past the rule, " +
    "present but not ranked against them.");

  V.bars(s1, {
    title: "Panel A — normalized gain g_b",
    subtitle: "What the benchmark actually scores: how much of the headroom above its own stateless baseline the system recovered.",
    height: 300,
    y: { label: "g_b", format: pc1 },
    groups: measureGroups(ORDER, "normalized gain g_b", function (id) { return A[id].g_b; }),
    dividers: DIVIDER,
    note: "Shows g_b for all five artifacts, bar colour fixed per system. Settles the ranking inside the " +
      "2.5-flash band: mubit-db-3 " + pc1(A["mubit-db-3"].g_b) + " > mubit-full-db-3 " +
      pc1(A["mubit-full-db-3"].g_b) + " > icl-db-3 " + pc1(A["icl-db-3"].g_b) + ". The rule marks a model " +
      "change, not a rank break — the 3.5-flash artifacts' near-zero gain is explained in Act II and is " +
      "not evidence that they are worse agents."
  });

  V.bars(s1, {
    title: "Panel B — answer accuracy",
    subtitle: "Fraction of the " + qCount + " questions answered correctly, mean of 3 runs. A different measure from gain, so a different chart.",
    height: 300,
    y: { label: "accuracy", format: pc1 },
    groups: measureGroups(ORDER, "accuracy (mean of 3 runs)", function (id) { return A[id].metrics.accuracy.mean; }),
    dividers: DIVIDER,
    note: "Shows mean accuracy. Settles the core 2.5-flash claim: mubit-db-3 answers " +
      pc1(A["mubit-db-3"].metrics.accuracy.mean) + " correctly against icl-db-3's " +
      pc1(A["icl-db-3"].metrics.accuracy.mean) + " — roughly 1.65× — and mubit-full-db-3 is " +
      "level with it at " + pc1(A["mubit-full-db-3"].metrics.accuracy.mean) + ". Run-to-run spread is real " +
      "(mubit-db-3 ranges " + pc1(A["mubit-db-3"].metrics.accuracy.min) + "–" +
      pc1(A["mubit-db-3"].metrics.accuracy.max) + " across its 3 runs); Act VII plots every run rather than " +
      "hiding it behind these means."
  });

  V.bars(s1, {
    title: "Panel C — input tokens consumed per run",
    subtitle: "Mean prompt tokens billed across a whole run of " + qCount + " questions. Different unit from accuracy, so a separate chart rather than a second axis.",
    height: 300,
    y: { label: "input tokens / run", format: V.fmt },
    groups: measureGroups(ORDER, "mean input tokens per run", meanInput),
    dividers: DIVIDER,
    note: "Shows mean input tokens over the 3 runs. Settles the efficiency half of the claim: mubit-db-3 " +
      "reaches its higher accuracy on " + V.fmt(meanInput("mubit-db-3")) + " input tokens against icl-db-3's " +
      V.fmt(meanInput("icl-db-3")) + " — about half — because it retrieves instead of re-sending the " +
      "whole history (Act III shows the mechanism). The 3.5-flash artifacts sit past the rule at ~" +
      V.fmt(meanInput("mubit-genai-db-3")) + "; they spend that on " +
      f1(A["mubit-genai-db-3"].metrics.avg_queries_per_question.mean) + " queries per question, not on a longer context."
  });

  // =========================================================== ACT II =====
  var gf = "mubit-genai-db-full-3.5flash";
  var s2 = act("Act II — the accuracy/gain tension",
    "The most accurate artifact in this repo has almost the worst gain. That is not a contradiction and it " +
    "is not a bug in the metric — it is the metric working. Gain is measured against the artifact's " +
    "<i>own</i> stateless baseline, and when the agent is allowed to brute-force the database, that baseline " +
    "catches up.");

  tiles(s2, [
    { lbl: "mubit-genai-full accuracy", val: pc1(A[gf].metrics.accuracy.mean), sub: "best in the repo — but on gemini-3.5-flash" },
    { lbl: "mubit-genai-full g_b", val: pc1(A[gf].g_b), sub: "second-worst gain in the repo" },
    { lbl: "Its stateful reward r_sf", val: f3(A[gf].r_sf), sub: "reward = 1 − normalized exploration regret" },
    { lbl: "Its stateless reward r_sl", val: f3(A[gf].r_sl), sub: "the baseline it must beat — it barely does" }
  ]);

  flag(s2, "warn",
    "<b>Accuracy is not the score.</b> <code>" + gf + "</code> answers " +
    pc1(A[gf].metrics.accuracy.mean) + " of questions correctly — the highest number on this page — " +
    "and still records g_b = " + pc1(A[gf].g_b) + ". Substituting into <code>g_b = (r_sf − r_sl) / " +
    "(r_max − r_sl)</code>: (" + f4(A[gf].r_sf) + " − " + f4(A[gf].r_sl) + ") / (" +
    A[gf].r_max.toFixed(1) + " − " + f4(A[gf].r_sl) + ") = " + f4(A[gf].g_b) + ". The numerator is the " +
    "whole story: memory bought it " + f4(A[gf].r_sf - A[gf].r_sl) + " reward, because its own memoryless " +
    "twin — spending " + f1(A[gf].metrics.avg_queries_per_question.mean) + " of the " + QUERY_CAP +
    " permitted queries on every single question — already gets almost all the way there by exhaustive search.");

  V.bars(s2, {
    title: "Where gain comes from: stateful reward against its own stateless baseline",
    subtitle: "Each pair is one artifact. The left bar is the system with memory on (coloured by system); the right bar is the identical agent with memory off. g_b is the gap, normalized by the headroom left above the baseline.",
    height: 320,
    y: { label: "mean reward (0–1)", format: f3 },
    groups: ORDER.map(function (id) {
      return {
        label: SHORT[id],
        sublabel: shortModel(A[id].model),
        bars: [
          { name: "stateful run (bar coloured by system)", color: colorOf(id), value: A[id].r_sf },
          { name: "its own stateless baseline", color: "--sys-baseline", value: A[id].r_sl }
        ]
      };
    }),
    dividers: DIVIDER,
    note: "Shows r_sf and r_sl side by side for every artifact. Settles why high accuracy can score no gain: " +
      "in the 2.5-flash band mubit-db-3 opens a gap of " + f3(A["mubit-db-3"].r_sf - A["mubit-db-3"].r_sl) +
      " reward over its baseline, while on 3.5-flash " + SHORT[gf] + " opens only " +
      f3(A[gf].r_sf - A[gf].r_sl) + ". Note the baselines are not equal across artifacts — that is exactly " +
      "why cross-band ranking is refused. The legend swatch for the left bar shows the first group's colour " +
      "only; every stateful bar is painted with its own system's hue, listed in the key at the top of the page."
  });

  V.bars(s2, {
    title: "Query effort against the cap",
    subtitle: "Mean queries issued per question, mean of 3 runs. The top of the axis is the observed query cap.",
    height: 300,
    y: { label: "queries per question", domain: [0, QUERY_CAP], ticks: [0, 3, 6, 9, 12, 15], format: f1 },
    groups: measureGroups(ORDER, "mean queries per question", function (id) { return A[id].metrics.avg_queries_per_question.mean; }),
    dividers: DIVIDER,
    note: "Shows query effort per question against the cap of " + QUERY_CAP + " (observed maximum across all " +
      questionRuns + " question-runs; " + budgetExceeded + " recorded budget_exceeded). Settles the mechanism " +
      "behind Act II: the 3.5-flash artifacts spend " + f1(A["mubit-genai-db-3"].metrics.avg_queries_per_question.mean) +
      " and " + f1(A[gf].metrics.avg_queries_per_question.mean) + " of " + QUERY_CAP + " queries, so there is " +
      "almost nothing a memory can save them — they and their baselines both approach exhaustive search. " +
      "The 2.5-flash artifacts stop at " + f1(A["icl-db-3"].metrics.avg_queries_per_question.mean) + "–" +
      f1(A["mubit-full-db-3"].metrics.avg_queries_per_question.mean) + ", leaving room for memory to matter. " +
      "Reward penalises queries, so this chart is also the cost side of the reward these systems are chasing."
  });

  // ========================================================== ACT III =====
  var iclCtx = D["icl-db-3"].runs[0].steps.context_tokens;
  var iclBase = D["icl-db-3"].baseline.steps.context_tokens;
  var muInp = D["mubit-db-3"].runs[0].steps.input_tokens;
  function xy(arr) { return arr.map(function (v, i) { return [i, v]; }); }
  function minOf(a) { return Math.min.apply(null, a); }
  function maxOf(a) { return Math.max.apply(null, a); }
  var muResets = 0, i;
  for (i = 1; i < muInp.length; i++) if (muInp[i] < muInp[i - 1]) muResets++;
  var iclDrops = 0;
  for (i = 1; i < iclCtx.length; i++) if (iclCtx[i] < iclCtx[i - 1]) iclDrops++;

  var s3 = act("Act III — why memory beats stuffing the context",
    "One run, every model call in order. This is the mechanism behind Panel C: in-context learning keeps the " +
    "whole history in the prompt and pays for it on every call, while retrieval re-anchors at each question. " +
    "Raw per-call values, no smoothing and no moving average.");

  V.lines(s3, {
    title: "Prompt size per model call, run 0",
    subtitle: "icl-db-3 carries its context forward; mubit-db-3 rebuilds a prompt from retrieved memory each question. Different call counts because the two agents take different numbers of steps.",
    height: 340,
    x: { label: "model call index within run 0" },
    y: { label: "prompt tokens", format: V.fmt },
    series: [
      { name: "icl-db-3 — context window", color: "--sys-icl", step: true, values: xy(iclCtx) },
      { name: "mubit-db-3 — prompt tokens per call", color: "--sys-mubit", step: true, values: xy(muInp) },
      { name: "stateless baseline (icl-db-3)", color: "--sys-baseline", dash: true, step: true, values: xy(iclBase) }
    ],
    note: "Shows every model call of run 0 for both systems plus the stateless baseline. Settles the " +
      "“why not just stuff the context” question: icl-db-3's context rises monotonically from " +
      V.fmt(iclCtx[0]) + " to " + maxOf(iclCtx).toLocaleString() + " tokens over " + iclCtx.length +
      " calls with " + iclDrops + " decreases — it never truncates, so the last question is priced at " +
      "roughly " + Math.round(maxOf(iclCtx) / iclCtx[0]) + "× the first. mubit-db-3 sawtooths " +
      muResets + " times (once per question boundary) and peaks at " + maxOf(muInp).toLocaleString() +
      ", about " + (maxOf(iclCtx) / maxOf(muInp)).toFixed(1) + "× lower. The dashed stateless baseline " +
      "also resets per question and stays under " + maxOf(iclBase).toLocaleString() + ", confirming the " +
      "growth is the ICL strategy and not the task."
  });

  // =========================================================== ACT IV =====
  function runCum(gains) {
    var acc = 0;
    return gains.map(function (v, k) { acc += v; return acc / (k + 1); });
  }
  function bandOf(id) {
    var cums = A[id].runs.map(function (r) { return runCum(r.gain_by_index); });
    return cums[0].map(function (_, k) {
      var col = cums.map(function (c) { return c[k]; });
      return [k, Math.min.apply(null, col), Math.max.apply(null, col)];
    });
  }
  var muCum = A["mubit-db-3"].series.cumulative_mean_gain_by_index;

  var s4 = act("Act IV — memory costs before it pays",
    "Cumulative normalized gain, recomputed after every question: the running mean of per-question gain, " +
    "which is exactly what the artifact's headline g_b converges to. The shaded envelope is the min/max of " +
    "the three runs — with n=3 that is the honest form of spread, not a standard-error bar.");

  V.lines(s4, {
    title: "Cumulative normalized gain across the " + qCount + " questions",
    subtitle: "Line = running mean over 3 runs. Band = min/max of the same running mean computed per run. 2.5-flash artifacts only — a shared axis here would be a cross-model comparison.",
    height: 360,
    x: { label: "question index (0-based, in-run order)" },
    y: { label: "cumulative mean gain", format: f3 },
    xRules: [{ at: 20, label: "schema migration" }],
    series: BAND_25.map(function (id) {
      return {
        name: SHORT[id],
        color: colorOf(id),
        values: xy(A[id].series.cumulative_mean_gain_by_index),
        band: bandOf(id)
      };
    }),
    note: "Shows how gain accumulates, with the n=3 envelope drawn rather than summarised. Settles the shape " +
      "of the benefit: mubit-db-3 starts NEGATIVE — " + f3(muCum[0]) + ", " + f3(muCum[1]) + ", " +
      f3(muCum[2]) + " over its first three questions — because building memory costs queries before any " +
      "of it can be reused, and only crosses into profit later, ending at " + f3(muCum[muCum.length - 1]) +
      ". The envelope is wide for the whole first half: at question 10 the three runs still disagree, so no " +
      "claim about an early lead survives n=3. The rule at index 20 marks the schema migration that Act V examines."
  });

  // ============================================================ ACT V =====
  function preOf(id) { return halfMean(A[id].series.mean_gain_by_index, 0, 20); }
  function postOf(id) { return halfMean(A[id].series.mean_gain_by_index, 20, 40); }
  function preRew(id) { return halfMean(A[id].series.mean_reward_by_index, 0, 20); }
  function postRew(id) { return halfMean(A[id].series.mean_reward_by_index, 20, 40); }
  function preBase(id) { return halfMean(A[id].series.baseline_reward_by_index, 0, 20); }
  function postBase(id) { return halfMean(A[id].series.baseline_reward_by_index, 20, 40); }
  function rel(id) { return (postOf(id) - preOf(id)) / preOf(id); }

  var s5 = act("Act V — the drift, stated against our own interest",
    "At question 21 the database schema migrates. The obvious story is “memory absorbs the drift”. " +
    "The measured numbers do not support that story cleanly, and this section says so.");

  V.bars(s5, {
    title: "Mean per-question gain, before and after the schema migration",
    subtitle: "Mean of mean_gain_by_index over questions 1–20 and 21–40. Both artifacts are gemini-2.5-flash, so they share one axis legitimately.",
    height: 300,
    y: { label: "mean gain per question", format: f4 },
    groups: [
      {
        label: "pre-drift", sublabel: "questions 1–20",
        bars: [
          { name: "mubit-db-3", color: "--sys-mubit", value: preOf("mubit-db-3") },
          { name: "icl-db-3", color: "--sys-icl", value: preOf("icl-db-3") }
        ]
      },
      {
        label: "post-drift", sublabel: "questions 21–40",
        bars: [
          { name: "mubit-db-3", color: "--sys-mubit", value: postOf("mubit-db-3") },
          { name: "icl-db-3", color: "--sys-icl", value: postOf("icl-db-3") }
        ]
      }
    ],
    note: "Shows pre/post mean gain for the two 2.5-flash contenders. Settles the drift claim in the " +
      "unflattering direction: mubit-db-3 rises " + f4(preOf("mubit-db-3")) + " → " +
      f4(postOf("mubit-db-3")) + " (+" + (rel("mubit-db-3") * 100).toFixed(1) + "% relative) while icl-db-3 " +
      "rises " + f4(preOf("icl-db-3")) + " → " + f4(postOf("icl-db-3")) + " (+" +
      (rel("icl-db-3") * 100).toFixed(1) + "% relative). ICL's RELATIVE improvement is nearly double " +
      "Mubit's. Mubit keeps the higher absolute gain in both halves, but this chart does not show memory " +
      "handling drift better than in-context stuffing — it shows the opposite trend in relative terms. " +
      "For reference mubit-full-db-3 goes " + f4(preOf("mubit-full-db-3")) + " → " +
      f4(postOf("mubit-full-db-3")) + " (+" + (rel("mubit-full-db-3") * 100).toFixed(1) + "%)."
  });

  V.bars(s5, {
    title: "Where the post-drift rise actually came from: stateful reward, before and after",
    subtitle: "Same halves, but the raw stateful reward rather than the gain. Gain is a ratio; this is its numerator's first term.",
    height: 300,
    y: { label: "mean reward per question", format: f4 },
    groups: [
      {
        label: "pre-drift", sublabel: "questions 1–20",
        bars: [
          { name: "mubit-db-3", color: "--sys-mubit", value: preRew("mubit-db-3") },
          { name: "icl-db-3", color: "--sys-icl", value: preRew("icl-db-3") }
        ]
      },
      {
        label: "post-drift", sublabel: "questions 21–40",
        bars: [
          { name: "mubit-db-3", color: "--sys-mubit", value: postRew("mubit-db-3") },
          { name: "icl-db-3", color: "--sys-icl", value: postRew("icl-db-3") }
        ]
      }
    ],
    note: "Shows stateful reward per half, which decomposes the previous chart. Settles what drove Mubit's " +
      "post-drift number: its own reward moved only " + f4(preRew("mubit-db-3")) + " → " +
      f4(postRew("mubit-db-3")) + ", while its stateless baseline FELL " + f4(preBase("mubit-db-3")) +
      " → " + f4(postBase("mubit-db-3")) + ". Part of Mubit's apparent post-drift improvement is the " +
      "baseline getting worse, not the stateful system getting better. ICL is the cleaner story here: its " +
      "reward genuinely climbed " + f4(preRew("icl-db-3")) + " → " + f4(postRew("icl-db-3")) +
      " even as its baseline also rose " + f4(preBase("icl-db-3")) + " → " + f4(postBase("icl-db-3")) + "."
  });

  flag(s5, "warn",
    "<b>What this section does not claim.</b> With n=3 and a single migration point, a pre/post split of " +
    "20 questions each is a two-sample comparison on very little data. The direction of the relative change " +
    "favours icl-db-3. Nothing here establishes that a memory system is more drift-robust; the honest " +
    "reading is that both systems did better on the second half of this question set, and that Mubit's share " +
    "of that is partly a baseline artifact.");

  // =========================================================== ACT VI =====
  function median(xs) {
    var srt = xs.slice().sort(function (a, b) { return a - b; });
    var n = srt.length;
    return n % 2 ? srt[(n - 1) / 2] : (srt[n / 2 - 1] + srt[n / 2]) / 2;
  }
  function clip(t, n) { return t.length > n ? t.slice(0, n - 1) + "…" : t; }

  function outcomeGrid(sec, id, extraNote) {
    var det = D[id];
    var qs = det.questions;
    var meds = det.runs.map(function (r) {
      return median(r.outcomes.map(function (o) { return o.num_queries; }));
    });
    var rows = det.runs.map(function (r, ri) {
      var nCorrect = r.outcomes.filter(function (o) { return o.correct; }).length;
      return {
        label: "run " + ri + " · " + nCorrect + "/" + qs.length + " correct",
        cells: r.outcomes.map(function (o, qi) {
          var q = qs[qi];
          return {
            color: o.correct ? "--st-good" : "--st-critical",
            faint: o.num_queries < meds[ri],
            tip: '<div class="th">Q' + (qi + 1) + " · id " + q.question_id + " · " +
              (o.correct ? "correct" : "wrong") + "</div>" +
              '<div style="white-space:normal;max-width:340px;color:var(--text-2);margin:0 0 6px">' +
              esc(q.question) + "</div>" +
              '<div class="tr">answered<b>' + esc(o.submitted_answer) + "</b></div>" +
              '<div class="tr">ground truth<b>' + esc(q.ground_truth) + "</b></div>" +
              '<div class="tr">queries<b>' + o.num_queries + " / " + QUERY_CAP + "</b></div>" +
              '<div class="tr">run median queries<b>' + meds[ri] + "</b></div>" +
              '<div class="tr">regret<b>' + V.fmt(o.regret, 1) + "</b></div>"
          };
        })
      };
    });
    var tableRows = qs.map(function (q, qi) {
      var row = [qi + 1, q.question_id, clip(q.question, 120), String(q.ground_truth), q.difficulty];
      det.runs.forEach(function (r) {
        var o = r.outcomes[qi];
        row.push((o.correct ? "correct" : "wrong") + " · " + o.num_queries + "q · “" +
          String(o.submitted_answer) + "”");
      });
      return row;
    });
    V.grid(sec, {
      title: "Per-question outcomes — " + id,
      subtitle: "One column per question in the order the agent saw them, one row per run. Hover any cell for the question text, the answer it submitted, the ground truth and the queries it spent.",
      width: 150 + qs.length * 28 + 24,
      rows: rows,
      rule: 20,
      ruleLabel: "schema migration",
      legend: [
        { name: "correct", color: "--st-good" },
        { name: "wrong", color: "--st-critical" }
      ],
      note: "Shows all " + (qs.length * det.runs.length) + " question-runs for " + id + " with no aggregation. " +
        "Faded cells are questions where the agent spent fewer queries than that run's own median " +
        "(medians by run: " + meds.join(", ") + "), so query effort is legible alongside the outcome. " +
        "All " + qs.length + " questions are labelled difficulty “hard” — there is no difficulty " +
        "variation in this dataset, so nothing can be plotted against it, and any “easy questions " +
        "inflated the score” objection has no purchase. " + (extraNote || ""),
      tableColumns: ["#", "question_id", "question (truncated to 120 chars)", "ground truth", "difficulty"]
        .concat(det.runs.map(function (_, ri) { return "run " + ri; })),
      tableRows: tableRows
    });
  }

  var s6 = act("Act VI — every question, no aggregation",
    "Means hide which questions were won. This is the raw outcome for all " +
    (qCount * 3) + " question-runs of each 2.5-flash contender, in presentation order, with the schema " +
    "migration marked. The table view under each grid carries the same information as text.");

  outcomeGrid(s6, "mubit-db-3",
    "Settles what mubit-db-3's " + pc1(A["mubit-db-3"].metrics.accuracy.mean) + " accuracy is made of: " +
    D["mubit-db-3"].runs.map(function (r) { return r.outcomes.filter(function (o) { return o.correct; }).length; }).join("/") +
    " correct across the three runs — the runs disagree about which questions they win, so the pattern " +
    "of green is not stable.");

  outcomeGrid(s6, "icl-db-3",
    "Settles the comparison at question level: " +
    D["icl-db-3"].runs.map(function (r) { return r.outcomes.filter(function (o) { return o.correct; }).length; }).join("/") +
    " correct, against mubit-db-3's " +
    D["mubit-db-3"].runs.map(function (r) { return r.outcomes.filter(function (o) { return o.correct; }).length; }).join("/") +
    ". The fading channel barely activates here, and that is itself the finding: two of icl-db-3's three " +
    "runs have a median of ONE query per question, so almost nothing can fall below the median. icl-db-3 " +
    "averages " + f1(A["icl-db-3"].metrics.avg_queries_per_question.mean) + " queries per question against " +
    "mubit-db-3's " + f1(A["mubit-db-3"].metrics.avg_queries_per_question.mean) +
    " — it is frequently answering on a single look rather than exploring, which is why it is cheap in " +
    "queries and wrong more often.");

  // ========================================================== ACT VII =====
  var s7 = act("Act VII — what n=3 can and cannot support",
    "Every run plotted individually. Both cards use the same x scale so nothing is exaggerated by rescaling, " +
    "but they are separate cards because they are separate base models and must not be read as one ranking.");

  var SCORE_X = { label: "run score (mean reward over the " + qCount + " questions)", domain: [0, 0.25], ticks: [0, 0.05, 0.1, 0.15, 0.2, 0.25], format: f3 };
  function dotRows(ids) {
    return ids.map(function (id) {
      return {
        label: SHORT[id],
        sublabel: shortModel(A[id].model) + " · " + A[id].system,
        color: colorOf(id),
        values: A[id].runs.map(function (r) { return r.score; })
      };
    });
  }

  V.dots(s7, {
    title: "Per-run score — gemini-2.5-flash band",
    subtitle: "Three runs each. The mean of these dots is exactly the r_sf that feeds g_b.",
    x: SCORE_X,
    rows: dotRows(BAND_25),
    note: "Shows all 9 individual run scores in the clean comparability band. Settles how much confidence " +
      "the Act I ranking deserves: mubit-db-3 scores " +
      A["mubit-db-3"].runs.map(function (r) { return f3(r.score); }).join(" / ") + " and icl-db-3 scores " +
      A["icl-db-3"].runs.map(function (r) { return f3(r.score); }).join(" / ") + " — THE RANGES OVERLAP. " +
      "mubit-db-3's worst run (" + f3(minOf(A["mubit-db-3"].runs.map(function (r) { return r.score; }))) +
      ") is below two of icl-db-3's three runs. The means differ in Mubit's favour and mubit-full-db-3 " +
      "overlaps both, but with n=3 this is a direction, not a proven separation. Do not quote the mean " +
      "without this picture."
  });

  V.dots(s7, {
    title: "Per-run score — gemini-3.5-flash band",
    subtitle: "Same x scale as the card above, deliberately kept on its own card: a different base model means a different reward scale and a different stateless baseline.",
    x: SCORE_X,
    rows: dotRows(BAND_35),
    note: "Shows the two 3.5-flash artifacts' run scores. Settles that their low scores are tight, not noisy: " +
      SHORT["mubit-genai-db-3"] + " scores " +
      A["mubit-genai-db-3"].runs.map(function (r) { return f3(r.score); }).join(" / ") + " and " + SHORT[gf] +
      " scores " + A[gf].runs.map(function (r) { return f3(r.score); }).join(" / ") + ". Reward here is low " +
      "precisely because reward penalises the " + f1(A["mubit-genai-db-3"].metrics.avg_queries_per_question.mean) +
      "–" + f1(A[gf].metrics.avg_queries_per_question.mean) +
      " queries per question these agents spend, even though their answers are the most accurate on the page. " +
      "These numbers must not be ranked against the card above."
  });

  // ========================================================= ACT VIII =====
  var s8 = act("Act VIII — latency and cost, kept apart",
    "Two measures with two units, so two charts. Seconds and dollars never share an axis on this page.");

  V.lines(s8, {
    title: "Mean wall-clock seconds per question",
    subtitle: "Raw per-question means over the 3 runs, in presentation order. No smoothing — the spikiness is the data.",
    height: 340,
    x: { label: "question index (0-based, in-run order)" },
    y: { label: "seconds per question", format: f1 },
    xRules: [{ at: 20, label: "schema migration" }],
    series: BAND_25.map(function (id) {
      return { name: SHORT[id], color: colorOf(id), values: xy(A[id].series.mean_latency_by_index) };
    }),
    note: "Shows per-question latency for the 2.5-flash band. Settles whether Mubit's accuracy is bought with " +
      "time: whole-run wall clock is " + Math.round(mean(A["mubit-db-3"].wall.runs.map(function (r) { return r.wall_duration_seconds; }))) +
      "s for mubit-db-3 against " + Math.round(mean(A["icl-db-3"].wall.runs.map(function (r) { return r.wall_duration_seconds; }))) +
      "s for icl-db-3 — essentially level, even though mubit-db-3 makes more model calls (" +
      Math.round(mean(A["mubit-db-3"].wall.runs.map(function (r) { return r.total_interactions; }))) +
      " against " + Math.round(mean(A["icl-db-3"].wall.runs.map(function (r) { return r.total_interactions; }))) +
      " per run), because each ICL call is slower: mean response " +
      f1(mean(A["icl-db-3"].wall.runs.map(function (r) { return r.avg_response_seconds; }))) + "s against " +
      f1(mean(A["mubit-db-3"].wall.runs.map(function (r) { return r.avg_response_seconds; }))) +
      "s, which is what a context growing to 96k tokens buys you (Act III). No min/max envelope is drawn " +
      "here: the export carries latency " +
      "only as a mean per question index, not per run, so the n=3 spread at this granularity was not measured."
  });

  var costable = ORDER.filter(function (id) { return A[id].usage.cost_reliable; });
  var uncostable = ORDER.filter(function (id) { return !A[id].usage.cost_reliable; });

  V.bars(s8, {
    title: "Mean USD cost per run",
    subtitle: "Provider-reported spend for one full run of " + qCount + " questions, averaged over the 3 runs. Only artifacts with reliable cost accounting appear.",
    height: 300,
    y: { label: "USD per run", format: usd },
    groups: measureGroups(costable, "mean cost per run (USD)", meanCost),
    note: "Shows measured spend for the " + costable.length + " artifacts whose usage records are cost-reliable. " +
      "Settles the price of the accuracy gap: mubit-db-3 costs " + usd(meanCost("mubit-db-3")) +
      " per run against icl-db-3's " + usd(meanCost("icl-db-3")) + " — Mubit is both more accurate and " +
      "marginally cheaper, because halving input tokens offsets its extra calls; mubit-full-db-3 is the " +
      "expensive one at " + usd(meanCost("mubit-full-db-3")) + ". EXCLUDED: " +
      uncostable.map(function (id) { return SHORT[id]; }).join(" and ") + " report " +
      "usage.cost_reliable = false and a literal cost_usd = 0 on every run — " +
      "that is missing accounting, not free inference, and plotting a zero there would read as the strongest " +
      "cost result on the page. They are therefore absent rather than shown at zero."
  });

  themeBtn.textContent = "Theme: auto";
})();
</script>
</body></html>
